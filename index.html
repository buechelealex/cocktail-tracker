<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarCheck</title>
<link rel="icon" type="image/x-icon" href="icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🍹 BarCheck</h1>
  <p>Tippe auf die Sterne, um zu bewerten · auf den Namen für Zutaten</p>
</header>

<div class="status" id="status">Lade Bewertungen…</div>

<div class="container">
  <div class="section-title">⭐ Bewertet</div>
  <div class="list" id="ratedList"></div>

  <div class="section-title">Unbewertet</div>
  <div class="list" id="unratedList"></div>

</div>

<div class="summary" id="summary"></div>

<button class="clear-btn" id="clearBtn">Alle Bewertungen zurücksetzen</button>
<button class="clear-btn" id="restoreBtn" style="display: none;"></button>

<footer class="footer">
  <a href="https://projects.abuechele.de/impressum" target="_blank" rel="noopener noreferrer">Impressum</a>
</footer>

<button class="fab" id="addBtn" type="button" title="Neuen Cocktail hinzufügen" aria-label="Neuen Cocktail hinzufügen">+</button>

<div class="modal-overlay" id="addOverlay">
  <div class="add-form" id="addForm" role="dialog" aria-modal="true" aria-labelledby="addFormTitle">
    <div class="add-form-header">
      <h2 id="addFormTitle">Neuen Cocktail hinzufügen</h2>
      <button class="modal-close" id="closeAddBtn" type="button" aria-label="Schließen">&times;</button>
    </div>
    <label for="newName">Name</label>
    <div class="name-input-wrap">
      <input type="text" id="newName" placeholder="z. B. Mai Tai" autocomplete="off">
      <ul class="suggestions-list" id="suggestionsList"></ul>
    </div>
    <label for="newIngredients">Zutaten (mit Komma getrennt)</label>
    <input type="text" id="newIngredients" placeholder="z. B. Rum, Limettensaft, Orgeat-Sirup" autocomplete="off">
    <div class="form-error" id="formError">Bitte einen Namen eingeben.</div>
    <div class="form-hint" id="autofillHint"></div>
    <div class="add-form-actions">
      <button class="cancel-cocktail-btn" id="cancelAddBtn" type="button">Abbrechen</button>
      <button class="save-cocktail-btn" id="saveAddBtn" type="button">Speichern</button>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
