<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarCheck</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=8">
<link rel="icon" type="image/png" href="icon-512.png?v=8">
<link rel="apple-touch-icon" href="icon-512.png?v=8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213a">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="shared/base.css?v=11">
<link rel="stylesheet" href="rate/style.css?v=11">
</head>
<body>

<header>
  <div class="top-inner">
    <a class="brand" href="index.html">
      <img src="icon.svg?v=8" alt="" width="32" height="32">
      <h1>BarCheck</h1>
    </a>
    <nav class="page-nav" aria-label="Seiten">
      <a href="index.html" class="active" aria-current="page">Bewerten</a>
      <a href="counter/index.html">Zähler</a>
      <a href="stats/index.html">Statistik</a>
    </nav>
  </div>
</header>

<div class="list-bar" id="listBar" aria-label="Eigene Listen"></div>

<div class="search-row">
  <input type="search" class="filter-input" id="filterInput" placeholder="Cocktail suchen…" aria-label="Cocktail suchen" autocomplete="off">
</div>

<div class="status" id="status">Lade Bewertungen…</div>

<div class="container">
  <h2 class="section-title"><button class="section-toggle" type="button" aria-expanded="true" aria-controls="ratedList">Bewertet <span class="section-count" id="ratedCount"></span></button></h2>
  <div class="list" id="ratedList"></div>

  <h2 class="section-title"><button class="section-toggle" type="button" aria-expanded="true" aria-controls="unratedList">Unbewertet <span class="section-count" id="unratedCount"></span></button></h2>
  <div class="list" id="unratedList"></div>

</div>

<div class="summary" id="summary"></div>

<button class="clear-btn" id="clearBtn">Alle Bewertungen zurücksetzen</button>
<button class="clear-btn" id="restoreBtn" style="display: none;"></button>

<footer class="footer">
  <p class="privacy-note">
    Alle Daten bleiben auf diesem Gerät. Bewertungen, Zählerstände und Listen
    werden nur lokal im Browser gespeichert, nicht auf einem Server.
  </p>
  <p class="footer-links">
    <a href="https://github.com/buechelealex/cocktail-tracker" target="_blank" rel="noopener noreferrer">Quellcode auf GitHub</a>
    <a href="https://projects.abuechele.de/impressum" target="_blank" rel="noopener noreferrer">Impressum</a>
  </p>
</footer>

<button class="fab" id="addBtn" type="button" title="Neuen Cocktail hinzufügen" >+ Cocktail</button>

<div class="modal-overlay" id="addOverlay">
  <div class="add-form" id="addForm" role="dialog" aria-modal="true" aria-labelledby="addFormTitle">
    <div class="add-form-header">
      <h2 id="addFormTitle">Neuen Cocktail hinzufügen</h2>
      <button class="modal-close" id="closeAddBtn" type="button" aria-label="Schließen">&times;</button>
    </div>
    <label for="newName">Name</label>
    <div class="name-input-wrap">
      <input type="text" id="newName" placeholder="z. B. Mai Tai" autocomplete="off">
      <ul class="suggestions-list" id="suggestionsList"></ul>
    </div>
    <label for="newIngredients">Zutaten (mit Komma getrennt)</label>
    <input type="text" id="newIngredients" placeholder="z. B. Rum, Limettensaft, Orgeat-Sirup" autocomplete="off">
    <div class="form-error" id="formError">Bitte einen Namen eingeben.</div>
    <div class="form-hint" id="autofillHint"></div>
    <div class="add-form-actions">
      <button class="cancel-cocktail-btn" id="cancelAddBtn" type="button">Abbrechen</button>
      <button class="save-cocktail-btn" id="saveAddBtn" type="button">Speichern</button>
    </div>
  </div>
</div>

<script src="shared/data.js?v=11"></script>
<script src="shared/lists.js?v=11"></script>
<script src="rate/catalog.js?v=11"></script>
<script src="rate/script.js?v=11"></script>
<script src="shared/pwa.js?v=11"></script>
</body>
</html>
