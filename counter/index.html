<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarCheck · Zähler</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg?v=8">
<link rel="icon" type="image/png" href="../icon-512.png?v=8">
<link rel="apple-touch-icon" href="../icon-512.png?v=8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#14213a">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="../shared/base.css?v=11">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<header>
  <div class="top-inner">
    <a class="brand" href="../index.html">
      <img src="../icon.svg?v=8" alt="" width="32" height="32">
      <h1>BarCheck</h1>
    </a>
    <nav class="page-nav" aria-label="Seiten">
      <a href="../index.html">Bewerten</a>
      <a href="index.html" class="active" aria-current="page">Zähler</a>
      <a href="../stats/index.html">Statistik</a>
    </nav>
  </div>
</header>

<div class="list-bar" id="listBar" aria-label="Eigene Listen"></div>

<div class="search-row">
  <input type="search" class="filter-input" id="filterInput" placeholder="Cocktail suchen…" aria-label="Cocktail suchen" autocomplete="off">
</div>

<div class="status" id="status">Lade Zählerstände…</div>

<div class="container">

  <h2 class="section-title"><button class="section-toggle" type="button" aria-expanded="true" aria-controls="drunkList">Getrunken <span class="section-count" id="drunkCount"></span></button></h2>
  <div class="list" id="drunkList"></div>

  <h2 class="section-title" id="notYetTitle"><button class="section-toggle" type="button" aria-expanded="true" aria-controls="notDrunkList">Noch nicht getrunken <span class="section-count" id="notDrunkCount"></span></button></h2>
  <div class="list" id="notDrunkList"></div>

</div>

<button class="clear-btn" id="resetBtn">Alle Zählerstände zurücksetzen</button>

<footer class="footer">
  <p class="privacy-note">
    Alle Daten bleiben auf diesem Gerät. Bewertungen, Zählerstände und Listen
    werden nur lokal im Browser gespeichert, nicht auf einem Server.
  </p>
  <p class="footer-links">
    <a href="https://github.com/buechelealex/cocktail-tracker" target="_blank" rel="noopener noreferrer">Quellcode auf GitHub</a>
    <a href="https://projects.abuechele.de/impressum" target="_blank" rel="noopener noreferrer">Impressum</a>
  </p>
</footer>

<script src="../shared/data.js?v=11"></script>
<script src="../shared/lists.js?v=11"></script>
<script src="script.js?v=11"></script>
<script src="../shared/pwa.js?v=11"></script>
</body>
</html>
